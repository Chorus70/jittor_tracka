train_transform:
  augments:
    - __target__: sample
      num_samples: 50000
      num_vertex_samples: 2048

    - __target__: normalize_pc

    - __target__: add_noise
      noise_std_min: 0.003
      noise_std_max: 0.024
      distribution: mixed
      anisotropic_p: 0.35
      outlier_p: 0.01
      outlier_std_multiplier: 3.0

    - __target__: linear
      scale: [0.9, 1.1]
      rotate_x_range: [-180, 180]
      rotate_y_range: [-180, 180]
      rotate_z_range: [-180, 180]
      scale_p: 0.25
      rotate_p: 0.75

    - __target__: patch
      patch_size: 1200
      num_patches: 2
      train_cvm_network: False

validate_transform: &validate_transform
  augments:
    - __target__: sample
      num_samples: 50000
      num_vertex_samples: 2048

    - __target__: normalize_pc

    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020
      distribution: mixed
      anisotropic_p: 0.25
      outlier_p: 0.005
      outlier_std_multiplier: 3.0

    - __target__: patch
      patch_size: 1200
      num_patches: 1
      train_cvm_network: False

predict_transform:
  augments: []
