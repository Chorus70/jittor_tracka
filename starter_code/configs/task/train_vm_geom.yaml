mode: train
debug: False
load_ckpt: experiments/vm_geom_ft/checkpoint_19_expanded.pkl

components:
  data: train_fast
  transform: finetune_geometry
  model: vm_geom_ft
  system: vm_geom_ft

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00002

trainer:
  epochs: 8
  save_every: 1
  lr_decay: 0.5
  lr_decay_every: 4
  loss_ema_alpha: 0.98
