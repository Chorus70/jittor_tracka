mode: train
debug: False
load_ckpt: experiments/vm_finetune/checkpoint_19.pkl

components:
  data: train_fast_b8
  transform: finetune_flow_surface
  model: vm_reliability_manifold_ft_small
  system: vm_reliability_manifold_ft

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.000002

trainer:
  epochs: 4
  save_every: 1
  save_every_steps: 100
  lr_decay: 0.5
  lr_decay_every: 2
  loss_ema_alpha: 0.98
