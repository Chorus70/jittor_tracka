mode: train
debug: False

components:
  data: train_fast_b8
  transform: finetune_narrow_noise
  system: vm_p1_narrow
  model: vm_narrow_noise_ft

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.001
  weight_decay: 0.0001

trainer:
  epochs: 30
  save_every: 5
  lr_decay: 0.9
  lr_decay_every: 10
