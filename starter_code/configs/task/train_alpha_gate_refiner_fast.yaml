mode: train
debug: False

components:
  data: train_fast_b8_w8
  transform: finetune_low_noise_refiner_fast
  model: alpha_gate_refiner_pct_neighbor
  system: alpha_gate_refiner

loss:
  loss_point: 1.0
  loss_patch_cd: 0.35
  loss_surface: 0.0
  loss_tangent: 0.0
  loss_alpha: 0.08
  loss_repulsion: 0.002

optimizer:
  __target__: adam
  lr: 0.00005

trainer:
  epochs: 8
  save_every: 1
  save_every_steps: 300
  lr_decay: 0.5
  lr_decay_every: 4
  loss_ema_alpha: 0.98
  max_steps_per_epoch: 1200
