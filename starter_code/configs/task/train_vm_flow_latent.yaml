mode: train
debug: False
load_ckpt: experiments/vm_finetune/checkpoint_19.pkl

components:
  data: train_fast
  transform: finetune_stable
  model: vm_flow_latent_ft
  system: vm_flow_latent_ft

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00001

trainer:
  epochs: 8
  save_every: 1
  save_every_steps: 100
  lr_decay: 0.5
  lr_decay_every: 4
  loss_ema_alpha: 0.98
