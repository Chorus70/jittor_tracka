mode: train
debug: False

components:
  data: train_fast_b8
  transform: finetune_normal
  model: vm_pct_denoise
  system: vm_pct_denoise

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00008

trainer:
  epochs: 8
  save_every: 1
  save_every_steps: 200
  lr_decay: 0.5
  lr_decay_every: 3
  loss_ema_alpha: 0.98
