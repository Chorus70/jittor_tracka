mode: train
debug: False
load_ckpt: experiments/vm_edge_pct_residual_score/warmstart_from_ft19.pkl

components:
  data: train_fast_b8
  transform: finetune_score_hybrid
  model: vm_edge_pct_residual_score
  system: vm_edge_pct_residual_score

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.000015

trainer:
  epochs: 8
  save_every: 1
  save_every_steps: 200
  lr_decay: 0.6
  lr_decay_every: 3
  loss_ema_alpha: 0.98
