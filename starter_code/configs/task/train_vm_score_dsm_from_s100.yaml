mode: train
debug: False
load_ckpt: experiments/vm_score_dsm/checkpoint_e0_s100.pkl

components:
  data: train_fast
  transform: score_dsm
  model: vm_score_dsm
  system: vm_score_dsm_cont

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0002

trainer:
  epochs: 3
  save_every: 1
  save_every_steps: 100
  lr_decay: 0.5
  lr_decay_every: 2
  loss_ema_alpha: 0.98
