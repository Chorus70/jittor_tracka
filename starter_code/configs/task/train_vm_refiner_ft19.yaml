mode: train
debug: False

components:
  data: train_fast
  transform: finetune_refiner
  system: vm_refiner_ft19
  model: vm_refiner_ft19

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00002

trainer:
  epochs: 4
  save_every: 1
  save_every_steps: 100
  lr_decay: 0.5
  lr_decay_every: 2
  loss_ema_alpha: 0.98
