mode: train
debug: False
load_ckpt: experiments/vm_robust/checkpoint_39.pkl

components:
  data: train_fast
  transform: finetune_stable
  system: vm_finetune
  model: vm_robust_ft

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00002

trainer:
  epochs: 25
  save_every: 5
  lr_decay: 0.5
  lr_decay_every: 10
  loss_ema_alpha: 0.98
