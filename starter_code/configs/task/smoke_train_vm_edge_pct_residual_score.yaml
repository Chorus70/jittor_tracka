mode: train
debug: False
load_ckpt: experiments/vm_edge_pct_residual_score/warmstart_from_ft19.pkl

components:
  data: train_smoke
  transform: finetune_score_hybrid
  model: vm_edge_pct_residual_score
  system: vm_edge_pct_residual_score

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00002

trainer:
  epochs: 1
  save_every: 0
  save_every_steps: 0
  lr_decay: 1.0
  loss_ema_alpha: 0.98
